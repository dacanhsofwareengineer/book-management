<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sách</title>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <div class="logo">
        <span class="logo__icon">📖</span>
        <h1 class="logo__text">Quản Lý Sách</h1>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <!-- DASHBOARD -->
      <section class="dashboard">
        <h2 class="sr-only">Dashboard</h2>
        <div class="dashboard__grid">
          <div class="stat-card">
            <h3 class="stat-card__title">Tổng số sách</h3>
            <p class="stat-card__value" id="stat-total">0</p>
          </div>
          <div class="stat-card">
            <h3 class="stat-card__title">Đã đọc</h3>
            <p class="stat-card__value" id="stat-read">0</p>
          </div>
          <div class="stat-card">
            <h3 class="stat-card__title">Chưa đọc</h3>
            <p class="stat-card__value" id="stat-unread">0</p>
          </div>
        </div>
      </section>

      <hr class="divider">

      <!-- TOOLBAR -->
      <section class="toolbar">
        <h2 class="sr-only">Công cụ</h2>
        <div class="toolbar__inner">
          <div class="toolbar__search">
            <input type="text" id="search-input" class="input" placeholder="Tìm kiếm sách">
          </div>
          <div class="toolbar__filters">
            <select id="filter-status" class="select">
              <option value="all">Tất cả</option>
              <option value="read">Đã đọc</option>
              <option value="unread">Chưa đọc</option>
            </select>
            <select id="sort-year" class="select">
              <option value="newest">Mới nhất</option>
              <option value="oldest">Cũ nhất</option>
            </select>
          </div>
          <div class="toolbar__actions">
            <button type="button" class="btn btn--primary" id="btn-add-book">+ Thêm sách</button>
          </div>
        </div>
      </section>

      <hr class="divider">

      <!-- SÁCH CỦA TÔI -->
      <section class="my-books">
        <h2 class="section-title">Sách của tôi</h2>
        <div class="book-grid" id="my-books-grid">
        <!-- Book Cards go here -->
        </div>
        
        <!-- PAGINATION -->
        <div class="pagination" id="pagination">
        <!-- Pagination buttons go here -->
        </div>
      </section>

      <hr class="divider">

      <!-- SÁCH ĐỀ XUẤT -->
      <section class="recommendations">
        <h2 class="section-title">Sách đề xuất</h2>
        <div class="book-grid recommendations-grid" id="recommendations-grid">
        <!-- Recommended Book Cards go here -->
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Quản Lý Sách</p>
    </div>
  </footer>

  <!-- MODAL ADD/EDIT -->
  <div class="modal" id="book-modal">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__content">
      <h2 class="modal__title" id="modal-title">Thêm sách</h2>
      <form id="book-form" class="form">
        <input type="hidden" id="book-id">
        <div class="form__group">
          <label for="book-title" class="sr-only">Tên sách *</label>
          <input type="text" id="book-title" class="input" placeholder="Tên sách *" required>
          <span class="form__error" id="error-title"></span>
        </div>
        <div class="form__group">
          <label for="book-author" class="sr-only">Tác giả *</label>
          <input type="text" id="book-author" class="input" placeholder="Tác giả *" required>
          <span class="form__error" id="error-author"></span>
        </div>
        <div class="form__group">
          <label for="book-year" class="sr-only">Năm xuất bản *</label>
          <input type="number" id="book-year" class="input" placeholder="Năm xuất bản *" required>
          <span class="form__error" id="error-year"></span>
        </div>
        <div class="form__group">
          <label for="book-cover" class="sr-only">Ảnh bìa (URL)</label>
          <input type="url" id="book-cover" class="input" placeholder="Ảnh bìa (URL)">
        </div>
        <div class="form__group">
          <label for="book-desc" class="sr-only">Mô tả</label>
          <textarea id="book-desc" class="input textarea" placeholder="Mô tả"></textarea>
        </div>
        <div class="form__group">
          <label for="book-status" class="sr-only">Trạng thái</label>
          <select id="book-status" class="select" required>
            <option value="" disabled selected hidden>Chọn trạng thái</option>
            <option value="read">Đã đọc</option>
            <option value="unread">Chưa đọc</option>
          </select>
          <span class="form__error" id="error-status"></span>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--secondary" id="btn-cancel-modal">Hủy</button>
          <button type="submit" class="btn btn--primary" id="btn-submit-modal">+ Thêm sách</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CONFIRM DELETE -->
  <div class="modal" id="confirm-modal">
    <div class="modal__overlay" id="confirm-overlay"></div>
    <div class="modal__content modal__content--small">
      <h2 class="modal__title">Xác nhận xóa</h2>
      <p class="modal__text">Bạn có chắc muốn xóa sách này không?</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" id="btn-cancel-delete">Hủy</button>
        <button type="button" class="btn btn--danger" id="btn-confirm-delete">Xóa</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
